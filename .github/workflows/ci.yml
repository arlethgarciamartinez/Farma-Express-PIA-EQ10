name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + pruebas + cobertura >= 80%
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farma
          POSTGRES_PASSWORD: farma
          POSTGRES_DB: farmaexpress_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farma" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://farma:farma@localhost:5432/farmaexpress_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Pruebas unitarias e integración (PostgreSQL) con cobertura
        run: pytest --cov-report=xml
      - name: Verificar trazabilidad BRD ↔ pruebas
        run: python scripts/verificar_trazabilidad.py
      - name: Ejecutar casos del paquete (CSV)
        run: python -m farmaexpress.infrastructure.ejecutor_casos --datos datos --salida resultados
      - uses: actions/upload-artifact@v4
        with:
          name: reporte
          path: |
            coverage.xml
            resultados/*.csv

  docker:
    name: Docker Compose (DB + App + Tests)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile test build
      - name: Pruebas dentro de Compose
        run: docker compose --profile test run --rm tests
      - name: Levantar app y probar /health
        run: |
          docker compose up -d --wait app
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/openapi.json > /dev/null
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
